name: Build Tower APK with VK Ads

on:
  workflow_dispatch:
  push:
    paths:
      - 'tower-release.zip'
      - 'build-template/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android project from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -f tower-release.zip
          mkdir -p work
          unzip -q tower-release.zip -d work
          SOURCE="work/tower-release/android-project"
          test -f "$SOURCE/assets/index.html"
          mkdir -p android-project
          cp -a "$SOURCE/assets" android-project/
          cp -a "$SOURCE/res" android-project/
          cp -a "$SOURCE/src" android-project/
          cp build-template/build.gradle android-project/build.gradle
          cp build-template/settings.gradle android-project/settings.gradle
          cp build-template/gradle.properties android-project/gradle.properties
          cp build-template/AndroidManifest.xml android-project/AndroidManifest.xml
          mkdir -p android-project/res/values
          cp "$SOURCE/res/values/strings.xml" android-project/res/values/strings.xml
          cp build-template/integers.xml android-project/res/values/integers.xml
          mkdir -p android-project/src/ru/stuzhin/tower
          cp build-template/MainActivity.java android-project/src/ru/stuzhin/tower/MainActivity.java

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tower-vk-ads-debug-apk
          path: android-project/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
